name: Atualizar cotações (LUPPUS)

on:
  schedule:
    # 06:10 e 18:10 horário de São Paulo (UTC-3) = 09:10 e 21:10 UTC
    - cron: '10 9,21 * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: scripts
      - run: node update-market-indices.js
        working-directory: scripts
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
