<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>LUPPUS | Em manutenção</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --obsidiana: #070809;
    --grafite: #121516;
    --marfim: #F5F3ED;
    --champagne: #D6B46A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at center, var(--grafite) 0%, var(--obsidiana) 70%);
    color: var(--marfim);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  main { max-width: 520px; }
  .logo { width: 120px; height: auto; margin-bottom: 28px; }
  h1 {
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    font-weight: 600;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    margin-bottom: 16px;
  }
  .divider {
    width: 48px; height: 1px;
    background: var(--champagne);
    margin: 0 auto 20px;
  }
  p { color: rgba(245, 243, 237, 0.72); line-height: 1.6; font-size: 1rem; }
  .slogan { margin-top: 32px; font-style: italic; font-size: 0.85rem; color: rgba(245, 243, 237, 0.4); }
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/logo-vertical.png" alt="LUPPUS" onerror="this.remove()">
  <h1>Estamos em manutenção</h1>
  <div class="divider"></div>
  <p>Estamos fazendo algumas melhorias na plataforma. Voltaremos em breve. Obrigado pela paciência.</p>
  <p class="slogan">find the signal</p>
</main>
</body>
</html>
